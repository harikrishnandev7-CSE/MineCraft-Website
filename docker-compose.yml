version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindcraft-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/mindcraft
      - REDIS_URL=redis://redis:6379
      - JUDGE0_URL=http://judge0-server:2358
      - JWT_SECRET=mindcraft_super_secret_jwt_key_2026
    depends_on:
      - mongo
      - redis
    networks:
      - mindcraft-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindcraft-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mindcraft-network

  mongo:
    image: mongo:6.0
    container_name: mindcraft-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mindcraft-network

  redis:
    image: redis:7-alpine
    container_name: mindcraft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mindcraft-network

volumes:
  mongo-data:
  redis-data:

networks:
  mindcraft-network:
    driver: bridge
